<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PlantCare – Smart Plant Care Management System. Grow Better, Care Smarter."
    />
    <title>PlantCare — Grow Better, Care Smarter</title>
    <link rel="icon" type="image/svg+xml" href="./icons/plantcare-logo.svg" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
        <div class="sidebar-header">
          <a href="#dashboard" class="brand-lockup" data-nav="dashboard">
            <img src="./icons/plantcare-logo.svg" alt="PlantCare logo" class="brand-logo" />
            <div class="brand-text">
              <span class="brand-name">PlantCare</span>
              <span class="brand-tagline">Grow Better, Care Smarter</span>
            </div>
          </a>
          <button
            id="sidebar-close-btn"
            class="icon-btn mobile-only"
            type="button"
            aria-label="Close navigation menu"
          >
            <span data-icon="x"></span>
          </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <button class="nav-item is-active" type="button" data-nav="dashboard">
            <span class="nav-icon" data-icon="layout-dashboard"></span>
            <span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" type="button" data-nav="plants">
            <span class="nav-icon" data-icon="sprout"></span>
            <span class="nav-label">My Plants</span>
            <span class="nav-badge" id="nav-badge-plants" hidden>0</span>
          </button>
          <button class="nav-item" type="button" data-nav="calendar">
            <span class="nav-icon" data-icon="calendar-days"></span>
            <span class="nav-label">Care Calendar</span>
          </button>
          <button class="nav-item" type="button" data-nav="reminders">
            <span class="nav-icon" data-icon="bell-ring"></span>
            <span class="nav-label">Reminders</span>
            <span class="nav-badge nav-badge-alert" id="nav-badge-reminders" hidden>0</span>
          </button>
          <button class="nav-item" type="button" data-nav="growth">
            <span class="nav-icon" data-icon="camera"></span>
            <span class="nav-label">Growth Diary</span>
          </button>
          <button class="nav-item" type="button" data-nav="recommendations">
            <span class="nav-icon" data-icon="book-open"></span>
            <span class="nav-label">Recommendations</span>
          </button>
          <button class="nav-item" type="button" data-nav="rewards">
            <span class="nav-icon" data-icon="award"></span>
            <span class="nav-label">Rewards</span>
          </button>
          <button class="nav-item" type="button" data-nav="insights">
            <span class="nav-icon" data-icon="bar-chart-3"></span>
            <span class="nav-label">Care Insights</span>
          </button>
          <button class="nav-item" type="button" data-nav="settings">
            <span class="nav-icon" data-icon="settings"></span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="storage-pill">
            <span class="storage-dot"></span>
            <div class="storage-pill-text">
              <strong>Local Browser Storage</strong>
              <span id="sidebar-demo-status">Private to this device</span>
            </div>
          </div>
        </div>
      </aside>

      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              id="mobile-menu-btn"
              class="icon-btn mobile-only"
              type="button"
              aria-label="Open navigation menu"
            >
              <span data-icon="menu"></span>
            </button>
            <div>
              <h1 id="topbar-title" class="topbar-title">Dashboard</h1>
              <p id="topbar-date" class="topbar-subtitle"></p>
            </div>
          </div>

          <div class="topbar-actions">
            <button
              id="topbar-reminder-btn"
              class="btn btn-ghost btn-with-badge"
              type="button"
              aria-label="Open reminder centre"
            >
              <span data-icon="bell"></span>
              <span class="desktop-label">Reminders</span>
              <span id="topbar-reminder-badge" class="pill-count" hidden>0</span>
            </button>
            <button id="topbar-schedule-btn" class="btn btn-secondary" type="button">
              <span data-icon="calendar-plus"></span>
              <span class="desktop-label">Schedule Care</span>
            </button>
            <button id="topbar-add-plant-btn" class="btn btn-primary" type="button">
              <span data-icon="plus"></span>
              <span>Add Plant</span>
            </button>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1"></main>

        <nav class="mobile-bottom-nav" aria-label="Quick Mobile Navigation">
          <button class="mobile-tab is-active" type="button" data-nav="dashboard">
            <span data-icon="layout-dashboard"></span>
            <span>Home</span>
          </button>
          <button class="mobile-tab" type="button" data-nav="plants">
            <span data-icon="sprout"></span>
            <span>Plants</span>
          </button>
          <button class="mobile-tab" type="button" data-nav="calendar">
            <span data-icon="calendar-days"></span>
            <span>Calendar</span>
          </button>
          <button class="mobile-tab" type="button" data-nav="reminders">
            <span data-icon="bell-ring"></span>
            <span>Alerts</span>
          </button>
          <button class="mobile-tab" type="button" data-nav="growth">
            <span data-icon="camera"></span>
            <span>Diary</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- Reusable Modal Container -->
    <div id="modal-root" class="modal-root" hidden aria-modal="true" role="dialog">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-dialog" id="modal-dialog">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">Modal</h2>
          <button id="modal-close-btn" class="icon-btn" type="button" aria-label="Close dialog">
            <span data-icon="x"></span>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
